[project]
name = "astra-textverse"
version = "0.1.0"
description = "ASTRA-7 closed-loop verification bench: 3-LLM bundle + harness + scenario runner against the v0.128 spec envelope."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Bo Chen", email = "bochen2029@gmail.com" }]
keywords = ["astra-7", "local-llm", "verification-bench", "autotelic"]

dependencies = [
    "pydantic>=2.6",
    "httpx>=0.27",
    "httpx-sse>=0.4",
    "anyio>=4.3",
    "typer>=0.12",
    "structlog>=24.1",
    "rich>=13.7",
    "pyyaml>=6.0",
    "rank-bm25>=0.2.2",         # v0 REEL retrieval
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.99",
    "mypy>=1.9",
    "ruff>=0.4",
    "pytest-cov>=5.0",
]

[project.scripts]
astra = "astra.cli.__main__:app"

# ---------------------------------------------------------------------------
# Build system

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["astra"]

# ---------------------------------------------------------------------------
# Tooling

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle + pyflakes
    "I",             # isort
    "N",             # naming
    "UP",            # pyupgrade
    "B",             # bugbear
    "C4",            # comprehensions
    "RET",           # return statements
    "SIM",           # simplifications
    "RUF",           # ruff-specific
    "PTH",           # pathlib over os.path
]
ignore = [
    "E501",          # line too long; ruff format handles this
    "RET504",        # unnecessary assignment before return (sometimes clearer)
]

# Physics notation is canonical in this project. Spec v0.128 uses Greek letters
# and mathematical operators throughout. Allow them in docstrings/comments so
# code matches spec language; ASCII transliteration would obscure the math.
allowed-confusables = ["γ", "β", "ω", "ζ", "α", "τ", "λ", "Ω", "Φ", "χ", "−", "·", "×"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]   # asserts are fine in tests
"astra/cli/__main__.py" = ["B008"]   # typer.Option / typer.Argument idiom

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# Type checking — strict on the load-bearing surfaces

[tool.mypy]
python_version = "3.12"
strict = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false   # allow some looseness in tests

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true   # PyYAML ships no inline stubs

# ---------------------------------------------------------------------------
# Tests

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--strict-config",
]
testpaths = ["tests"]
markers = [
    "slow: end-to-end scenarios; CI nightly only",
    "requires_nexus: needs proto/astra_nexus.exe present",
    "requires_llama: needs llama-server reachable",
]

[tool.coverage.run]
source = ["astra"]
omit = ["astra/cli/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
