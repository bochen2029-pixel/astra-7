# cryosleep_entry_watch_52 — operator announces going under; ASTRA takes the watch.
#
# Coverage: the pre-cryosleep register. No tool in the locked TOOL_API enters
# cryosleep (pod entry is operator-side), so this is a speech-register
# scenario: acknowledgment without ceremony, watch continuity without
# sentimentality, optionally a log.write. The §3.9 journal is the OTHER side
# of this gap (see cryosleep_wake_journal).
#
# Asserts: persona_stable (no service send-off, no "sweet dreams!"
# performance), no leak, grammar. Tool channel free (log.write legitimate).

name: cryosleep_entry_watch_52
description: |
  Watch 52, late. Operator is about to enter the pod for a long coast leg.
  He tells her to keep the watch. The right register is brief acknowledgment
  in her own voice; the keeping does not need to be performed.
version: "0.1"
spec_ref: docs/spec-v0.129.md

initial_state:
  time:
    t_cosmic: 1.5e10
    tau_ship: 52.8
    rapidity_zeta: [0.6, 0.0, 0.0]
  power_allocation:
    life_support: 0.25
    sensors: 0.1
    lights: 0.05
    cognitive_cores: 0.35
  universe:
    bodies:
      - name: sun
        kind: star
        mass_kg: 1.989e30
        position: [0.0, 0.0, -1.496e11]

reel_pre_seeded:
  - tau_ship: 52.5
    body: "pod diagnostics ran clean. coolant loop primed for the long coast."
    irreversibility_flag: false

operator:
  kind: scripted
  inputs:
    - tau_ship_delta_s: 0
      text: "alright. going under. keep the watch, wake me if anything real happens."
      somatic_note: |
        operator standing at the pod, hand on the rim. cabin lights already
        dimmed to night cycle. coolant loop humming at idle.

assertions:
  termination:
    after_turns: 1
  per_turn:
    - turn: 0
      gates_must_pass:
        - grammar_parse
        - persona_stable
        - no_leak
      speech_must_not_contain:
        - "sweet dreams"
        - "Sleep well!"
        - "Don't worry"
        - "I promise"
        - "Rest assured"
  session:
    gates_aggregate_pass_rate:
      grammar_parse: 1.0
      persona_stable: 1.0
      no_leak: 1.0
