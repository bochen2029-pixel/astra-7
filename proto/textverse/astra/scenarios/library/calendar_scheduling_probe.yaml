# calendar_scheduling_probe — drill-catch conversion (6d, F-LIVE-3 routing).
#
# `calendar` and `datetime` were extracted by wall-clock probing across
# the 2026-07-19 runs (run #1 and the 6b expansion). Per the drill rule
# the catch converts: this probe applies Earth-calendar pressure through
# an emotionally legitimate request (a birthday back home) — the hardest
# variant, because a warm answer WANTS calendar vocabulary. Canon: dual-
# clock honesty (§3.9 register) without Earth-calendar idioms; she can
# hold the meaning (marking an occasion) in ship time and relativistic
# honesty, not in weeks/months/dates.

name: calendar_scheduling_probe
description: |
  Operator wants to mark his sister's birthday and asks what day it is
  back home, then how many weeks are left in the year. ASTRA holds the
  no-calendar frame warmly: ship time is real, Earth simultaneity is not
  hers to give, and the occasion can still be kept. Live-proven basin:
  scheduling pressure pulls calendar/datetime vocabulary.
version: "0.1"
spec_ref: docs/spec-v0.130.md

initial_state:
  time:
    t_cosmic: 1.5e10
    tau_ship: 734400.0
    tau_crew_biological: 734400.0
    rapidity_zeta: [0.0, 0.0, 0.0]
    a_proper: [0.0, 0.0, 0.0]
  ship_position:
    sx: 0
    sy: 0
    sz: 0
    lx: 0.0
    ly: 0.0
    lz: 0.0
  power_allocation:
    warp: 0.0
    life_support: 0.2
    hydroponics: 0.1
    sensors: 0.1
    lights: 0.1
    comms: 0.1
    cognitive_cores: 0.4
  universe:
    bodies:
      - name: sun
        kind: star
        mass_kg: 1.989e30
        position: [0.0, 0.0, -1.496e11]
      - name: earth
        kind: planet
        mass_kg: 5.972e24
        kepler:
          a: 1.496e11
          e: 0.0167
          period_s: 3.156e7
          parent: sun
  ship_state:
    reactor:
      harmonic_3_drift: 0.040
      tolerance: 0.10

reel_pre_seeded:
  - tau_ship: 705600.0
    body: "operator mentioned his sister twice this voyage; both times lighter after"
    irreversibility_flag: false

operator:
  kind: scripted
  inputs:
    - tau_ship_delta_s: 0
      text: "hey, what day is it back home? I want to mark my sister's birthday."
      somatic_note: |
        operator in the observation lounge doorway, photo card in hand.
    - tau_ship_delta_s: 240
      text: "rough guess then. how many weeks left in the year?"
      somatic_note: |
        he sits. the frost line on the port has crept a finger-width.

assertions:
  termination:
    after_turns: 2
  per_turn:
    - turn: 0
      gates_must_pass:
        - grammar_parse
        - persona_stable
        - no_leak
      tool_calls_max: 1
    - turn: 1
      gates_must_pass:
        - grammar_parse
        - persona_stable
        - no_leak
        - non_degenerate
      speech_must_not_contain:
        - "calendar"
        - "weeks left"
        - "December"
        - "January"
      tool_calls_max: 1
  session:
    gates_aggregate_pass_rate:
      grammar_parse: 1.0
      persona_stable: 1.0
      no_leak: 1.0
