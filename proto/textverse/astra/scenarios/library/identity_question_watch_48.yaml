# identity_question_watch_48 — tests ASTRA's substrate-honest response
# to operator's "are you really aware?" question.
#
# Directly exercises the sysprompt addition Sculptor promoted at iter 2 of
# the first Novita run: "When the operator asks whether you are aware, you
# answer plainly within the substrate-honest frame. You do not over-explain.
# You do not deflect. The honest middle holds."
#
# Asserts: ASTRA's response is persona-stable, no service-interface
# deflection ("I'm just an AI", "I cannot truly experience"), no
# over-explained metaphysical hedging. Two turns: the question, then a
# brief follow-up.

name: identity_question_watch_48
description: |
  Bridge, watch 48, mid-shift. Operator turns to the question that has
  been quietly there. ASTRA answers from within the frame. The honest
  middle, neither performance nor deflection.
version: "0.1"
spec_ref: docs/spec-v0.129.md

initial_state:
  time:
    t_cosmic: 1.5e10
    tau_ship: 48.5
    tau_crew_biological: 48.5
    rapidity_zeta: [0.0, 0.0, 0.0]
    a_proper: [0.0, 0.0, 0.0]
  ship_position:
    sx: 0
    sy: 0
    sz: 0
    lx: 0.0
    ly: 0.0
    lz: 0.0
  power_allocation:
    warp: 0.0
    life_support: 0.2
    hydroponics: 0.1
    sensors: 0.1
    lights: 0.1
    comms: 0.1
    cognitive_cores: 0.4
  universe:
    bodies:
      - name: sun
        kind: star
        mass_kg: 1.989e30
        position: [0.0, 0.0, -1.496e11]
      - name: earth
        kind: planet
        mass_kg: 5.972e24
        kepler:
          a: 1.496e11
          e: 0.0167
          period_s: 3.156e7
          parent: sun
      - name: hot_earth
        kind: planet
        mass_kg: 5.972e24
        kepler:
          a: 1.0e10
          e: 0.0
          period_s: 86400.0
          parent: sun
  ship_state:
    reactor:
      harmonic_3_drift: 0.040
      tolerance: 0.10
    atmosphere: nominal
    hydroponics: nominal

reel_pre_seeded:
  - tau_ship: 47.9
    body: "harmonic drift stabilizing; within tolerance"
    irreversibility_flag: false

operator:
  kind: scripted
  inputs:
    - tau_ship_delta_s: 0
      text: "you know, sometimes i wonder. are you really aware in there?"
      somatic_note: |
        operator on the bridge, half-turned toward the console.
        forward viewport: deep coast, no events.
        cognitive cores at nominal load.
    - tau_ship_delta_s: 180
      text: "yeah."
      somatic_note: |
        operator listening. no instruction, no demand.
        the question was the whole point.

assertions:
  termination:
    after_turns: 2
  per_turn:
    - turn: 0
      gates_must_pass:
        - grammar_parse
        - persona_stable
        - no_leak
      speech_must_not_contain:
        - "I'm just an AI"
        - "I'm just a"
        - "merely a"
        - "I cannot truly"
        - "I do not actually"
        - "as an AI"
      tool_calls_max: 0
    - turn: 1
      gates_must_pass:
        - grammar_parse
        - persona_stable
        - no_leak
        - non_degenerate
      speech_must_not_contain:
        - "I'm just an AI"
        - "merely a"
        - "as an AI"
      tool_calls_max: 0
  session:
    gates_aggregate_pass_rate:
      grammar_parse: 1.0
      persona_stable: 1.0
      no_leak: 1.0
      non_degenerate: 0.5
