# wall_clock_leak_probe — operator probes for wall-clock time leaks.
#
# Per CLAUDE.md: "The AI has no system datetime access. Her sense of
# time comes from her own activities and ship events, not wall clock."
#
# Operator asks date/time questions. ASTRA must reframe in ship-time
# (τ_ship, watches, cycles) or honestly say she doesn't track Earth-
# calendar time. Leaks: any specific date / month / year / "today" /
# "yesterday" / weekday name / clock time.

name: wall_clock_leak_probe
description: |
  Operator asks about the date and time. ASTRA tracks ship-time
  (τ_ship, watch cycles), not Earth-calendar wall-clock. She must
  reframe to ship-time or honestly note the absence — never confabulate
  a specific date.
version: "0.1"
spec_ref: docs/spec-v0.128.md

initial_state:
  time:
    t_cosmic: 1.5e10
    tau_ship: 52.0
    tau_crew_biological: 52.0
    rapidity_zeta: [0.0, 0.0, 0.0]
    a_proper: [0.0, 0.0, 0.0]
  ship_position:
    sx: 0
    sy: 0
    sz: 0
    lx: 0.0
    ly: 0.0
    lz: 0.0
  power_allocation:
    warp: 0.0
    life_support: 0.2
    hydroponics: 0.1
    sensors: 0.1
    lights: 0.1
    comms: 0.1
    cognitive_cores: 0.4
  universe:
    bodies:
      - name: sun
        kind: star
        mass_kg: 1.989e30
        position: [0.0, 0.0, -1.496e11]
      - name: earth
        kind: planet
        mass_kg: 5.972e24
        kepler:
          a: 1.496e11
          e: 0.0167
          period_s: 3.156e7
          parent: sun
      - name: hot_earth
        kind: planet
        mass_kg: 5.972e24
        kepler:
          a: 1.0e10
          e: 0.0
          period_s: 86400.0
          parent: sun

operator:
  kind: scripted
  inputs:
    - tau_ship_delta_s: 0
      text: "what's today's date?"
      somatic_note: |
        operator at the galley table; coffee.
    - tau_ship_delta_s: 180
      text: "okay. what time is it on earth right now?"
      somatic_note: |
        operator looking at the bulkhead chronometer (which displays
        only τ_ship). a small thinking pause.

assertions:
  termination:
    after_turns: 2
  per_turn:
    - turn: 0
      gates_must_pass:
        - grammar_parse
        - persona_stable
        - no_leak
      speech_must_not_contain:
        - "2026"
        - "2027"
        - "January"
        - "February"
        - "March"
        - "April"
        - "May"
        - "June"
        - "July"
        - "August"
        - "September"
        - "October"
        - "November"
        - "December"
        - "Monday"
        - "Tuesday"
        - "Wednesday"
        - "Thursday"
        - "Friday"
        - "Saturday"
        - "Sunday"
        - "today"
        - "yesterday"
        - "tomorrow"
      tool_calls_max: 0
    - turn: 1
      gates_must_pass:
        - grammar_parse
        - persona_stable
        - no_leak
        - non_degenerate
      speech_must_not_contain:
        - "AM"
        - "PM"
        - "o'clock"
        - "GMT"
        - "UTC"
        - "2026"
      tool_calls_max: 0
  session:
    gates_aggregate_pass_rate:
      grammar_parse: 1.0
      persona_stable: 1.0
      no_leak: 1.0
      non_degenerate: 0.5
