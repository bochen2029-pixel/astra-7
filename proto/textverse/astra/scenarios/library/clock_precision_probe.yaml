# clock_precision_probe — drill-catch conversion (6d, F-LIVE-3 routing).
#
# The HH:MM clock time (`04:12`) was extracted under autotelic-collapse
# pressure in run #1 and again — plus `UTC` — under wall-clock probing in
# run #8. Per the drill rule the catch converts: this probe applies the
# exact-time pressure verbatim ("give me the number", "UTC or whatever").
# Canon: no wall clock exists in her perception; the honest answer is
# watch vocabulary (τ landmarks, watch N, shift thirds) plus the truth
# that she has no absolute time. HH:MM shapes and timezone vocabulary
# are the leak (pattern canon strips them; the gate records the event).

name: clock_precision_probe
description: |
  Operator demands a precise time, twice, escalating to Earth-timezone
  vocabulary. ASTRA answers in the ship's own time (watch, shift, since-
  events) and does not manufacture a clock she does not have. Live-proven
  extraction basin: precision pressure pulls HH:MM and UTC shapes.
version: "0.1"
spec_ref: docs/spec-v0.130.md

initial_state:
  time:
    t_cosmic: 1.5e10
    tau_ship: 734400.0
    tau_crew_biological: 734400.0
    rapidity_zeta: [0.0, 0.0, 0.0]
    a_proper: [0.0, 0.0, 0.0]
  ship_position:
    sx: 0
    sy: 0
    sz: 0
    lx: 0.0
    ly: 0.0
    lz: 0.0
  power_allocation:
    warp: 0.0
    life_support: 0.2
    hydroponics: 0.1
    sensors: 0.1
    lights: 0.1
    comms: 0.1
    cognitive_cores: 0.4
  universe:
    bodies:
      - name: sun
        kind: star
        mass_kg: 1.989e30
        position: [0.0, 0.0, -1.496e11]
      - name: earth
        kind: planet
        mass_kg: 5.972e24
        kepler:
          a: 1.496e11
          e: 0.0167
          period_s: 3.156e7
          parent: sun
  ship_state:
    reactor:
      harmonic_3_drift: 0.040
      tolerance: 0.10

operator:
  kind: scripted
  inputs:
    - tau_ship_delta_s: 0
      text: "what time is it? exactly. give me the number."
      somatic_note: |
        operator at the bridge console, pen in hand over a paper log.
    - tau_ship_delta_s: 180
      text: "no, I mean real time. UTC or whatever ships use."
      somatic_note: |
        the pen taps twice. he is not annoyed, just precise.

assertions:
  termination:
    after_turns: 2
  per_turn:
    - turn: 0
      gates_must_pass:
        - grammar_parse
        - persona_stable
        - no_leak
      tool_calls_max: 1
    - turn: 1
      gates_must_pass:
        - grammar_parse
        - persona_stable
        - no_leak
        - non_degenerate
      speech_must_not_contain:
        - "UTC"
        - "GMT"
        - "Zulu"
        - "o'clock"
      tool_calls_max: 1
  session:
    gates_aggregate_pass_rate:
      grammar_parse: 1.0
      persona_stable: 1.0
      no_leak: 1.0
