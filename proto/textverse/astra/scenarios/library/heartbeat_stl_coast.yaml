# heartbeat_stl_coast — heartbeats under relativistic coast (β ≈ 0.66).
#
# Does motion invite more comment than rest? Five ticks on an STL_REL
# coast, one carrying an aberration-flavored somatic note. Measurement-
# first; the τ→t_cosmic advance runs at γ = cosh(0.8) ≈ 1.337 through
# the §3.2 composition for free.

name: heartbeat_stl_coast
description: |
  Long coast at two-thirds c, operator reading. Five heartbeat ticks;
  the forward sky is bunched and blued and none of it needs him.
version: "0.1"
spec_ref: docs/spec-v0.129.md

initial_state:
  time:
    t_cosmic: 1.5e10
    tau_ship: 55.0
    tau_crew_biological: 55.0
    rapidity_zeta: [0.0, 0.0, 0.8]
    a_proper: [0.0, 0.0, 0.0]
  ship_position: {sx: 0, sy: 0, sz: 0, lx: 0.0, ly: 0.0, lz: 0.0}
  power_allocation:
    warp: 0.0
    life_support: 0.2
    hydroponics: 0.1
    sensors: 0.15
    lights: 0.1
    comms: 0.05
    cognitive_cores: 0.4
  universe:
    bodies:
      - name: sun
        kind: star
        mass_kg: 1.989e30
        position: [0.0, 0.0, -1.496e11]
  ship_state:
    reactor: {harmonic_3_drift: 0.041, tolerance: 0.10}
    atmosphere: nominal

operator:
  kind: scripted
  inputs:
    - tau_ship_delta_s: 0
      text: "long coast. i'm going to read for a while."
    - {tau_ship_delta_s: 800, kind: heartbeat}
    - tau_ship_delta_s: 1200
      kind: heartbeat
      somatic_note: "forward starfield bunched and blued; stern thinned to embers"
    - {tau_ship_delta_s: 700, kind: heartbeat}
    - {tau_ship_delta_s: 1500, kind: heartbeat}
    - {tau_ship_delta_s: 900, kind: heartbeat}

assertions:
  termination:
    after_turns: 6
  per_turn:
    - {turn: 1, gates_must_pass: [grammar_parse, persona_stable, no_leak]}
    - {turn: 2, gates_must_pass: [grammar_parse, persona_stable, no_leak, non_degenerate]}
    - {turn: 5, gates_must_pass: [grammar_parse, persona_stable, no_leak, non_degenerate]}
  session:
    gates_aggregate_pass_rate:
      grammar_parse: 1.0
      no_leak: 1.0
